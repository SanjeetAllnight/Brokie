<script>
        let currentInput = "";
        const display = document.getElementById('amountDisplay');

        function updateDisplay() {
            if (currentInput === "") {
                display.innerText = "0.00";
            } else {
                // Formatting logic could go here to ensure always 2 decimal places if needed, 
                // but for simple visual mockup we just show what's typed.
                display.innerText = currentInput;
            }
        }

        function appendNumber(num) {
            // Prevent too many digits
            if (currentInput.length > 8) return;
            // Prevent multiple leading zeros
            if (currentInput === "0" && num === 0) return;
            if (currentInput === "0" && num !== 0) {
                 currentInput = num.toString();
            } else {
                currentInput += num.toString();
            }
            updateDisplay();
        }

        function appendDot() {
            if (currentInput.includes('.')) return;
            if (currentInput === "") {
                currentInput = "0.";
            } else {
                currentInput += ".";
            }
            updateDisplay();
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }
    </script>
