<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<title>Brokie - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "inverse-surface": "#30302f",
                        "on-error-container": "#93000a",

                    spacing: {

                        "base": "8px",
                        "card-inner": "20px",
                        "stack-gap": "16px",
                        "margin-mobile": "16px"
                    },
                    fontFamily: {
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],

                        "label-caps": ["Plus Jakarta Sans"],

                        "headline-md": ["Plus Jakarta Sans"]

                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Gradient Background */
        body {
            background: linear-gradient(135deg, #f27fa0 0%, #cebdff 100%);
            background-attachment: fixed;
        }
        
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-on-background min-h-screen pb-32 pt-20 px-container-padding flex flex-col gap-stack-gap font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 bg-background/80 backdrop-blur-md flex items-center justify-between px-container-padding py-base shadow-sm">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Good Morning 👋</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Brokie</span>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A small, stylized profile avatar of a confident user in a vibrant, game-like setting. High-quality 3D render style with soft lighting and a modern, slightly chaotic financial survival theme aesthetic. Primary colors of deep indigo and coral pink are subtly integrated." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPcXMG5lKpofrsQQ9Qkzyx7f5oDigxagkNQzO2Lp1Rl62wnBrIdBaHNweXo8Soqhy2CccPvaHZ_kM2TUL9W5wbn206_Oq1NC56S8bSKtjwX1z7vR_pkGd-Uykd08fxpAK1uUU0UHmFaHO4-MDtzy7ltTf79rFgUpVHMABbbB62gs8J3veyGjZ13xIpwKBzM5_0l7GFTjF0A2FDjKEStr7ov_QIfkGbUMpIOLi5z8XebUjAEEMU6m4b5g">
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex flex-col gap-stack-gap mt-4">
<!-- Wallet Balance Card (Survival Card) -->
<section class="bg-surface-container-lowest rounded-xl p-card-inner shadow-[0px_8px_24px_rgba(75,59,124,0.08)] flex flex-col gap-4 relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-20 -mr-10 -mt-10 pointer-events-none"></div>
<div class="flex justify-between items-start z-10">
<div>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current Stash</h2>
<div class="font-display-currency text-display-currency text-on-surface mt-1">$1,240.50</div>
</div>
<div class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[16px] fill">local_fire_department</span>
                    12 Day Streak
                </div>
</div>
<!-- Wallet HP Bar -->
<div class="flex flex-col gap-2 z-10 mt-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md font-bold text-on-surface">Financial Health</span>
<span class="font-label-caps text-label-caps text-primary">84% HP</span>
</div>
<div class="w-full h-3 bg-secondary/10 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-emerald-400 to-primary-container rounded-full w-[84%] transition-all duration-1000 ease-out shadow-inner"></div>
</div>
</div>
</section>
<!-- Bento Grid for Stats -->
<section class="grid grid-cols-2 gap-4">
<!-- Danger Zone Module -->
<div class="col-span-2 bg-surface-container-lowest rounded-xl p-card-inner shadow-[0px_8px_24px_rgba(75,59,124,0.08)] flex items-center justify-between border-l-4 border-error">
<div>
<div class="font-label-caps text-label-caps text-error uppercase mb-1">Danger Zone</div>
<div class="font-headline-md text-headline-md text-on-surface font-bold">$200.00 <span class="text-body-md font-normal text-on-surface-variant">left</span></div>
</div>
<div class="bg-surface-container-low px-3 py-1.5 rounded-full border border-outline-variant flex items-center gap-2">
<span class="text-lg">🟢</span>
<span class="font-label-caps text-label-caps text-on-surface">Vibing</span>
</div>
</div>
<!-- Mini Stat 1 -->
<div class="bg-surface-container-lowest rounded-xl p-card-inner shadow-[0px_8px_24px_rgba(75,59,124,0.08)] flex flex-col gap-2">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined fill">payments</span>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase">Spent Today</div>
<div class="font-headline-md text-headline-md text-on-surface">$15.00</div>
</div>
<!-- Mini Stat 2 -->
<div class="bg-surface-container-lowest rounded-xl p-card-inner shadow-[0px_8px_24px_rgba(75,59,124,0.08)] flex flex-col gap-2">
<div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center text-secondary mb-2">
<span class="material-symbols-outlined fill">verified_user</span>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase">Survival</div>
<div class="font-headline-md text-headline-md text-on-surface">18 Days</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<!-- JSON Specs: style_shell_layout: "fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2" -->
<!-- Active State Logic: Home is active -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0px_-8px_24px_rgba(75,59,124,0.08)] rounded-t-lg md:hidden">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold scale-110 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined fill text-[28px]">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</button>
<!-- Stats -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary-container transition-colors active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]">leaderboard</span>
<span class="font-label-caps text-label-caps mt-1">Stats</span>
</button>
<!-- Add (FAB Style in Nav) -->
<div class="relative -top-6">
<button class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-transform duration-150 border-4 border-surface-container-lowest">
<span class="material-symbols-outlined text-[32px]">add_circle</span>
</button>
<span class="absolute -bottom-5 left-1/2 -translate-x-1/2 font-label-caps text-label-caps text-on-surface-variant whitespace-nowrap">Add</span>
</div>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary-container transition-colors active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
<!-- Vault -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary-container transition-colors active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]">shield</span>
<span class="font-label-caps text-label-caps mt-1">Vault</span>
</button>
</nav>
<!-- Optional JS for subtle interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Add subtle pulse to HP bar if it's low
            const hpBar = document.querySelector('.bg-gradient-to-r');
            if(hpBar) {
                // Just a visual effect for demo
                setTimeout(() => {
                    hpBar.style.width = '84%';
                }, 100);
            }
        });
    </script>
</body></html>
